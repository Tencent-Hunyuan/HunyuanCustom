[tool.poetry]
name = "hymm-video-generation"
version = "0.1.0"
description = "A video generation and editing system with audio capabilities"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    { include = "hymm_sp" },
    { include = "hymm_gradio" }
]

[tool.poetry.dependencies]
python = "^3.9"
opencv-python = "4.9.0.80"
diffusers = "0.33.0"
transformers = "4.41.2"
accelerate = "1.1.1"
pandas = "2.0.3"
numpy = "^1.26.0"
einops = "0.7.0"
tqdm = "4.66.2"
loguru = "0.7.2"
imageio = "2.34.0"
imageio-ffmpeg = "0.5.1"
safetensors = "0.4.3"
gradio = "3.39.0"
librosa = "0.11.0"
fastapi = "*"
uvicorn = "*"
onnxruntime = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"

[tool.poetry.scripts]
test = "pytest:main"
tests = "pytest:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*", "*Tests"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=hymm_sp",
    "--cov=hymm_gradio",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=0",
    "--tb=short",
    "--maxfail=1",
    "-v"
]
markers = [
    "unit: Mark test as a unit test",
    "integration: Mark test as an integration test",
    "slow: Mark test as slow running",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["hymm_sp", "hymm_gradio"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
    "*/setup.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"